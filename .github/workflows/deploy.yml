name: Continuous Deployment to VPS

on:
  push:
    branches:
      - main

jobs:
  test-and-build:
    name: Test & Build Check
    runs-on: ubuntu-latest
    env:
      JWT_SECRET: 0c51217d7a628ef407f4af35b6e7d6560051e7ef41582dac2121fafdf459c03f2c119fd8a202d1681e7bc99b20d5fb1cb02b55baaa2f256ae0b34cca6e121b0e
      POSTGRES_HOST: 178.238.226.206
      POSTGRES_PORT: 5432
      POSTGRES_USER: ajaysaagar
      POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD || 'aass209c' }}
      POSTGRES_DATABASE: ajaysaagar
      DATABASE_URL: "postgresql://ajaysaagar:${{ secrets.POSTGRES_PASSWORD || 'aass209c' }}@178.238.226.206:5432/ajaysaagar"

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Run Test Suite (Vitest)
        run: npm test

      - name: TypeScript Verification
        run: npx tsc --noEmit

      - name: Next.js Production Build
        run: npm run build

  deploy-to-vps:
    name: Deploy to VPS
    needs: test-and-build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST || '178.238.226.206' }}
          username: ${{ secrets.VPS_USERNAME || 'root' }}
          password: ${{ secrets.VPS_PASSWORD }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script_stop: true
          script: |
            echo "🚀 Starting Teader automatic deployment on VPS..."
            
            # Navigate to project directory or clone if not present
            DEPLOY_DIR="/var/www/teader"
            if [ ! -d "$DEPLOY_DIR" ]; then
              DEPLOY_DIR="$HOME/teader"
            fi
            
            if [ -d "$DEPLOY_DIR" ]; then
              cd "$DEPLOY_DIR"
              echo "📂 Navigated to $DEPLOY_DIR"
              git fetch origin main
              git reset --hard origin/main
            else
              echo "📂 Cloning repository to $DEPLOY_DIR"
              git clone https://github.com/ajaysaagar-dev/teader.git "$DEPLOY_DIR"
              cd "$DEPLOY_DIR"
            fi

            # Install dependencies
            echo "📦 Installing production dependencies..."
            npm ci || npm install

            # Compile production build
            echo "⚡ Building Next.js application..."
            npm run build

            # Restart application process with PM2 or Docker
            if command -v pm2 &> /dev/null; then
              echo "🔄 Restarting via PM2 process manager..."
              pm2 reload ecosystem.config.js --env production || pm2 start ecosystem.config.js --env production || pm2 start npm --name "teader" -- start
              pm2 save
            elif command -v docker-compose &> /dev/null; then
              echo "🐳 Restarting via Docker Compose..."
              docker-compose up -d --build
            else
              echo "🔄 Launching Next.js server..."
              nohup npm start > teader.log 2>&1 &
            fi

            echo "✅ Teader successfully deployed and live on VPS!"
