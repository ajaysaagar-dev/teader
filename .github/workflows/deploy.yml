name: Continuous Deployment to VPS (Main Branch)

on:
  push:
    branches:
      - main

jobs:
  test-and-build:
    name: Test & Build Verification
    runs-on: ubuntu-latest
    env:
      JWT_SECRET: 0c51217d7a628ef407f4af35b6e7d6560051e7ef41582dac2121fafdf459c03f2c119fd8a202d1681e7bc99b20d5fb1cb02b55baaa2f256ae0b34cca6e121b0e
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: 5432
      POSTGRES_USER: ajaysaagar
      POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD || 'aass209c' }}
      POSTGRES_DATABASE: ajaysaagar
      DATABASE_URL: "postgresql://ajaysaagar:${{ secrets.POSTGRES_PASSWORD || 'aass209c' }}@127.0.0.1:5432/ajaysaagar"

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm install --legacy-peer-deps --no-audit

      - name: Run Test Suite (Vitest)
        run: npm test

      - name: TypeScript Verification
        run: npx tsc --noEmit

      - name: Next.js Production Build
        run: npm run build

  deploy-to-vps:
    name: Deploy to Production VPS
    needs: test-and-build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST || '178.238.226.206' }}
          username: ${{ secrets.VPS_USERNAME || 'root' }}
          password: ${{ secrets.VPS_PASSWORD || 'Shri@123' }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script_stop: true
          script: |
            echo "🚀 Starting Teader automatic deployment from main branch..."
            
            DEPLOY_DIR="/var/www/teader"
            if [ ! -d "$DEPLOY_DIR" ]; then
              DEPLOY_DIR="$HOME/teader"
            fi
            
            if [ -d "$DEPLOY_DIR" ]; then
              cd "$DEPLOY_DIR"
              echo "📂 Navigated to $DEPLOY_DIR"
              git reset --hard HEAD || true
              git clean -fd || true
              git fetch origin main
              git checkout -f -B main origin/main
              git reset --hard origin/main
              git clean -fd
            else
              echo "📂 Cloning main branch to $DEPLOY_DIR"
              git clone -b main https://github.com/ajaysaagar-dev/teader.git "$DEPLOY_DIR"
              cd "$DEPLOY_DIR"
            fi

            # Navigate into teader-web directory if inside monorepo root
            if [ -d "teader-web" ]; then
              cd teader-web
              echo "📂 Navigated to teader-web directory"
            fi

            # Install dependencies
            echo "📦 Installing production dependencies..."
            npm install --legacy-peer-deps

            # Compile production build
            echo "⚡ Building Next.js application..."
            npm run build

            # Zero-downtime PM2 reload
            if command -v pm2 &> /dev/null; then
              echo "🔄 Reloading PM2 cluster..."
              pm2 reload ecosystem.config.js --env production || pm2 restart teader --update-env || pm2 start ecosystem.config.js --env production
              pm2 save
            elif command -v docker-compose &> /dev/null; then
              echo "🐳 Restarting via Docker Compose..."
              docker-compose up -d --build
            else
              echo "🔄 Launching Next.js server..."
              nohup npm start > teader.log 2>&1 &
            fi

            echo "✅ Teader successfully deployed from 'production' branch to VPS!"
